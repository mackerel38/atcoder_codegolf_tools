name: Build toolchain image

on:
  workflow_dispatch:
    inputs:
      language:
        description: Toolchain to build
        required: true
        type: choice
        options:
          - apl
          - awk
          - a-lang
          - bash
          - cpp23-gcc
          - clay
          - dc
          - octave
          - perl
          - pypy311
          - r
          - ruby
          - uiua
          - codon
      push_image:
        description: Push the image to GHCR
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - id: spec
        name: Resolve language specification
        run: |
          python3 tools/manifest_query.py \
            '${{ inputs.language }}' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: inputs.push_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ inputs.push_image }}
          tags: >-
            ghcr.io/${{ github.repository_owner }}/atcoder-codegolf-${{
            inputs.language }}:2025-10
          build-args: |
            SPEC_URL=${{ steps.spec.outputs.spec_url }}
          cache-from: |
            type=gha,scope=${{ inputs.language }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/atcoder-codegolf-${{ inputs.language }}:buildcache
          cache-to: >-
            type=registry,
            ref=ghcr.io/${{ github.repository_owner }}/atcoder-codegolf-${{ inputs.language }}:buildcache,
            mode=max
